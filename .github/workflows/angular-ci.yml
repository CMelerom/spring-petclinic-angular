name: Angular CI

on:
  push:
    branches: [ master ]

jobs:
  build:

    runs-on: helm-gh-runner

    steps:
    - uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435

    - name: Connect
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USER }}
        password: ${{ secrets.DOCKER_TOKEN }}

    - name: Use Node.js
      uses: actions/setup-node@v2
      with:
        node-version: '18'

    - name: Install Chromium via Puppeteer
      run: npx puppeteer browsers install chrome

    - name : Install Dependencies
      run: npm ci

    - name: Install Browser Dependencies
      run: |
        sudo apt-get update || true
        sudo apt-get install -y libnspr4 libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxext6 libxfixes3 libxrandr2 libgbm1 libasound2t64 libpango-1.0-0 libcairo2

    - name: Install Chrome via Puppeteer
      run: |
        export PUPPETEER_CACHE_DIR=$HOME/.cache/puppeteer
        npx puppeteer browsers install chrome

    - name: Build
      run: npm run build --if-present -- --configuration production

    - name: Test
      run: |
        export CHROME_BIN=$(find $HOME/.cache/puppeteer -name chrome -type f | head -n 1)
        npm run test-headless

    - name: Build
      run: docker build -t ${{ secrets.DOCKER_USER }}/angular:v1 .

    - name: Push
      run: docker push ${{ secrets.DOCKER_USER }}/angular:v1

    - name: Install kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: 'latest'

    - name: Set Kubernetes Context
      uses: azure/k8s-set-context@v3
      with:
        method: kubeconfig
        kubeconfig: ${{ secrets.KUBE_CONFIG }}

    - name: Deploy Kubernetes
      run: |
        kubectl apply -f deployment.yaml --insecure-skip-tls-verify
        kubectl rollout restart deployment/angular-deployment -n arc --insecure-skip-tls-verify
    

    