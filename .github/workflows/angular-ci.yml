name: Angular CI 

on:
  push:
    branches: [ master ]

jobs:
  build_test:

    runs-on: helm-gh-runner

    container:
      image: cmelerom/node_install:v2
      credentials:
        username: ${{ secrets.DOCKER_USER }}
        password: ${{ secrets.DOCKER_TOKEN }}

    steps:
    - uses: actions/checkout@v3

    - name : Install Dependencies
      run: npm ci

    - name: Build
      run: npm run build --if-present -- --configuration production

    - name: Test
      run: |
        export CHROME_BIN=$(find /root/.cache/puppeteer -name chrome -type f | head -n 1)
        npm run test-headless

    - name: SonarQube
      uses: SonarSource/sonarqube-scan-action@v3 
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }} #
        SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}


  reusable:
    needs: build_test
    uses: CMelerom/Github-action/.github/workflows/reusable.yml@master
    with:
      image: "angular"          
      deployment: "angular-deployment" 
    secrets:
      DOCKER_USER: ${{ secrets.DOCKER_USER }}
      DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
      KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
    

    