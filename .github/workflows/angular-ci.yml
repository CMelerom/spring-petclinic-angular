name: Angular CI v2

on:
  push:
    branches: [ master ]

jobs:
  build_test:

    runs-on: helm-gh-runner

    container:
      image: cmelerom/node_install:v1
      credentials:
        username: ${{ secrets.DOCKER_USER }}
        password: ${{ secrets.DOCKER_TOKEN }}

    steps:
    - uses: actions/checkout@v3

    - name : Install Dependencies
      run: npm ci

    - name: Install Chrome via Puppeteer
      run: |
        export PUPPETEER_CACHE_DIR=$HOME/.cache/puppeteer
        npx puppeteer browsers install chrome

    - name: Build
      run: npm run build --if-present -- --configuration production

    - name: Test
      run: |
        export CHROME_BIN=$(find $HOME/.cache/puppeteer -name chrome -type f | head -n 1)
        npm run test-headless

  docker_push:
    runs-on: helm-gh-runner
    needs: build_test
    steps:

    - uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435

    - name: Connect
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USER }}
        password: ${{ secrets.DOCKER_TOKEN }}

    - name: Build
      run: docker build -t ${{ secrets.DOCKER_USER }}/angular:v1 .

    - name: Push
      run: docker push ${{ secrets.DOCKER_USER }}/angular:v1


  deploy:
    runs-on: helm-gh-runner
    needs: docker_push 
    steps:

    - uses: actions/checkout@v3

    - name: Install kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: 'latest'

    - name: Set Kubernetes Context
      uses: azure/k8s-set-context@v3
      with:
        method: kubeconfig
        kubeconfig: ${{ secrets.KUBE_CONFIG }}

    - name: Deploy Kubernetes
      run: |
        kubectl apply -f deployment.yaml --insecure-skip-tls-verify
        kubectl rollout restart deployment/angular-deployment -n arc --insecure-skip-tls-verify
    

    