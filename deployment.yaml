apiVersion: apps/v1
kind: Deployment
metadata:
  name: angular-deployment
  namespace: arc
  labels:
    app: angular
spec:
  replicas: 1
  selector:
    matchLabels:
      app: angular
  template:
    metadata: 
      labels:
        app: angular
    spec:
      containers: 
       - name: angular
         image: cmelerom/angular:v2
         ports:
         - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: angular-service
  namespace: arc
spec:
  type: NodePort
  selector:
    app: angular
  ports:
  - port: 8080
    targetPort: 8080